# 地球纪元 · 纯静态站点的 Nginx 配置样例
# 用法：把 dist/ 上传到 /var/www/earth-chronicle，然后把本文件放到 /etc/nginx/conf.d/earth-chronicle.conf，
#       修改 server_name 后执行 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;          # 改成你的域名或服务器公网 IP
    root /var/www/earth-chronicle;        # dist/ 的内容
    index index.html;

    # 三个页面都是独立 HTML，直接按路径映射；找不到时回到主页
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 贴图、模型、数据体积较大且文件名固定，允许浏览器长期缓存
    location ~* \.(webp|png|jpg|glb|bin|json)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    # Vite 产物带内容哈希，可永久缓存
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # HTML 不缓存，保证发布后立刻生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # 文本类资源开启 gzip（webp/glb 已压缩，不必再压）
    gzip on;
    gzip_types text/html text/css application/javascript application/json application/octet-stream;
    gzip_min_length 1024;

    # 少数发行版的 mime.types 缺少这两项
    types {
        model/gltf-binary glb;
        image/webp webp;
    }
}
